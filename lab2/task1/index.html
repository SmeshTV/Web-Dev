<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook – войдите или зарегистрируйтесь</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="left">
      <h1 class="logo">facebook</h1>
      <p class="slogan">
        Facebook помогает вам всегда<br>
        оставаться на связи и общаться со<br>
        своими знакомыми.
      </p>
    </div>

    <div class="right">
      <form class="login-form">
        <input type="text" placeholder="Электронный адрес или номер телефона" aria-label="Электронный адрес или номер телефона">
        <input type="password" placeholder="Пароль" aria-label="Пароль">

        <button type="submit" class="btn login">Вход</button>

        <a href="#" class="forgot">Забыли пароль?</a>

        <hr>

        <button type="button" class="btn create">Создать новый аккаунт</button>
      </form>

      <p class="create-page">
        <a href="#">Создать страницу</a> знаменитости, музыкальной группы или компании.
      </p>
    </div>
  </main>
</body>
</html>
