<div class="card">
  <div class="image-container">
    <button class="nav-btn prev" (click)="prevImage()">‹</button>
    <img [src]="currentImage" [alt]="product.name" class="main-img">
    <button class="nav-btn next" (click)="nextImage()">›</button>
  </div>

  <div class="thumbnails">
    <img *ngFor="let img of product.images; let i = index"
         [src]="img"
         [class.active]="i === currentImageIndex"
         (click)="setImage(i)"
         alt="thumbnail">
  </div>

  <div class="content">
    <h3>{{ product.name }}</h3>
    <p class="description">{{ product.description }}</p>

    <div class="meta">
      <span class="price">{{ product.price | number:'1.0-0' }} ₸</span>
      <div class="rating">
        <span *ngFor="let s of stars" class="star" [class.full]="s==='full'" [class.half]="s==='half'">★</span>
        <span class="rating-value">({{ product.rating }})</span>
      </div>
    </div>

    <div class="likes">
      <button class="like-btn" (click)="toggleLike()">
        <span [class.liked]="isLiked">❤️</span> {{ product.likes }}
      </button>
    </div>

    <div class="actions">
      <a [href]="product.link" target="_blank" class="btn primary">На Kaspi</a>
      <button class="btn whatsapp" (click)="shareToWhatsApp()">Wa</button>
      <button class="btn telegram" (click)="shareToTelegram()">Tg</button>
      <button class="btn delete" (click)="confirmDelete()">Удалить</button>
    </div>
  </div>
</div>
